<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />
    <link rel="shortcut icon" href="../img/icon-stethoscope.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/medico.css">
    <title>Medicos</title>
</head>
<body>
    <header class="header-principal">
        <div class="logo">
            <img src="../img/icons-estetoscópio-48.png" alt="Logo do site">
            <h1>Sistema Médico</h1>
        </div>
        <div class="mobile" onclick="clickMenuMedico()">
                <div class="lines"></div>
                <div class="lines"></div>
                <div class="lines"></div>
        </div>
        <div class="mobile" style="display: none;"></div>
        <nav class="navbar">
            <ul class="navbar-list">        
                <li><a href="../index.html"><img src="../img/icon-home.svg" alt="icone casa">Inicio</a></li>
                <li><a href="medico.html"><img src="../img/icon-stethoscope.svg" alt="icone medico">Medicos</a></li>
                <li><a href="pacientes.html"><img src="../img/icons-pessoas-48.svg" alt="icone pacientes">Pacientes</a></li>
                <li><a href="consulta.html"><img src="../img/icon-calendar-42.svg" alt="icone consulta">Consultas</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <header class="header-segundario">
            <h2>Cadastro de Médicos</h2>
            <p>Gerencie o cadastro de médicos do sistema</p>
        </header>


        <section class="gerenciamento">

            <form action="">
                <h3><img  class="img-novo-medico" src="../img/icon-user-add.svg" alt="">Novo Medico</h3>
                <p>Preencha os dados do médico</p>

                <label for="nome-medico">Nome Completo</label>
                <input 
                type="text" 
                id="nome-medico"
                placeholder="Dr. João Silva" 
                maxlength="100"
                required 
                autocomplete="off">
                
                <label for="crm">CRM*</label>
                <input 
                type="text"
                id="crm" 
                maxlength="7"
                placeholder="12345-SP" 
                required
                autocomplete="off"> 

                <label for="especialidade-medico">Especialidade*</label>
                <select id="especialidade-medico" required>
                <option value="">Selecione uma especialidade</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="dermatologia">Dermatologia</option>
                <option value="ortopedia">Ortopedia</option>
                <option value="pediatria">Pediatria</option>
                <option value="ginecologista">Ginecologista</option>
                <option value="oftalmologista">Oftalmologista</option>
                <!-- ... -->
                </select>
                <!--<input type="text" placeholder="Cardiologia" required>-->

                <label for="telefone-medico">Telefone</label>
                <input
                type="tel"
                id="telefone-medico"
                placeholder="(11)933542074" 
                maxlength="15"
                pattern="\(\d{2}\)\s?\d{4,5}-\d{4}"
                title="Formato esperado: (11) 93354-2074"
                autocomplete="off">

                <label for="email-medico">E-mail</label>
                <input 
                type="email"
                id="email-medico"
                placeholder="medico@hospital.com" 
                maxlength="100"
                autocomplete="off">

                <div class="btns">
                    <button type="button" class="btn-salvar" onclick="salvarFormularioMedico()">Cadastrar Médico</button>
                    <button type="button" class="btn-cancelar" onclick="limparFormularioMedico()"
                    ><span class="material-symbols-outlined">close</span>
                    Cancelar</button>
                </div>
    
            </form>

           <article class="no-sistema">
                <h3>Médicos Cadastrados</h3>
                <p>Total de <span id="total-de-medicos-cadastrados"></span> médico(s) no sistema</p>

                <div class="tabela-scroll">
                    <table class="tabela" id="tabela-medicos">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CRM</th>
                            <th>Especialidade</th>
                            <th>Telefone</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="medicos-cadastrado">
                    
                            <!--<tr>
                                <td>Dr. João Silva</td>
                                <td>12345-SP</td>
                                <td>Cardiologia</td>
                                <td>(11) 98765-4321</td>
                                <td>joao.silva@hospital.com</td>
                                <td><button class="btn-excluir" onclick="this.closest('tr').remove()"><img src="../img/icon-trash.svg" alt="Icone trash"></button></td>
                            </tr>
                            aqui o JS vai inserir uma <tr> pra cada médico -->
                    </tbody>
                    </table>
                </div>
            </article>
        </section>
    </main>
    <script src="../dist/medico.js"></script>
</body>
</html>
