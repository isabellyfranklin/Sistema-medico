<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />
    <link rel="shortcut icon" href="../img/icon-calendar-42.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/medico.css">
    <title>Consulta</title>
</head>
<body>
     <header class="header-principal">
        <div class="logo">
            <img src="../img/icon-stethoscope.svg" alt="Logo do site">
            <h1>Sistema Médico</h1>
        </div>
        <div class="mobile" style="display: none;"></div>
        <nav class="navbar">
            <ul class="navbar-list">        
                <li><a href="../index.html"><img src="../img/icon-home.svg" alt="icone casa">Inicio</a></li>
                <li><a href="medico.html"><img src="../img/icons-estetoscópio-48.png" alt="icone medico">Medicos</a></li>
                <li><a href="pacientes.html"><img src="../img/icons-pessoas-48.svg" alt="icone pacientes">Pacientes</a></li>
                <li><a href="consulta.html"><img src="../img/icon-calendar-42.svg" alt="icone consulta">Consultas</a></li>
            </ul>
        </nav>
    </header>

    <main>
         <header class="header-segundario">
            <h2>Cadastro Consultas</h2>
            <p>Gerencie os agendamentos de consultas</p>
        </header>


        <section class="gerenciamento">

            <form action="">
                <h3><img class="img-novo-medico" src="../img/icon-calendar-42.svg" alt="">Nova Consulta</h3>
                <p>Agende uma nova consulta</p>

                <label for="select-medico">Médico*</label>
                <select id="select-medico" required>
                    <option value="">Selecione um médico</option>
                </select>

                <label for="select-paciente">Paciente*</label>
                <select id="select-paciente" required>
                 <option value="">Selecione um paciente</option>
                </select>

                <label for="data-consulta">Data*</label>
                <input type="date" id="data-consulta" required>

                <label for="horario-consulta">Horário*</label>
                <input type="time" id="horario-consulta" required>

                <label for="obs-consulta">Observações</label>
                <input type="text" id="obs-consulta" maxlength="200">

                <div class="btns">
                    <button type="button" class="btn-salvar" onclick="agendarConsulta()">Agendar Consulta</button>
                    <button type="button" class="btn-cancelar" onclick="cancelarConsulta()">
                        <span class="material-symbols-outlined">close</span>
                        Cancelar
                    </button>
                </div>
</form>

             

                <article class="no-sistema">
                    <h3>Consultas Agendadas</h3>
                     <p>Total de<span id="total-de-consultas-agendadas"></span> consulta(s) no sistemas </p>

                    <div class="tabela-scroll">
                        <table class="tabela" id="tabela-consultas-agendadas">
                        <thead>
                            <tr>
                                <th>Paciente</th>
                                <th>Médico</th>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Observações</th>
                                <th>Ações<th>                             
                            </tr>
                    </thead>
                    <tbody id="tconsultas-agendadas">
                   
                            <!--<tr>
                                <td>João Silva</td>
                                <td>123.456.789.12</td>
                                <td>13/05/2005</td>
                                <td>(11) 98765-4321</td>
                                <td>joao.silva@hospital.com</td>
                                <td><button class="btn-excluir"><img src="../img/icon-trash.svg" alt="Icone trash"></button></td>
                            </tr>
                            aqui o JS vai inserir uma <tr> de cada paciente  -->
                    </tbody>
                    </table>
                </div>
            </article>
        </section>
    </main>



    <script src="../dist/consulta.js"></script>
</body>
</html>
