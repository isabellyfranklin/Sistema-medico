<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />
    <link rel="shortcut icon" href="../img/icon-calendar-42.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/medico.css">
    <title>Consulta</title>
</head>
<body>
     <header class="header-principal">
        <div class="logo">
            <img src="../img/icon-stethoscope.svg" alt="Logo do site">
            <h1>Sistema Médico</h1>
        </div>
        <div class="mobile" style="display: none;"></div>
        <nav class="navbar">
            <ul class="navbar-list">        
                <li><a href="../index.html"><img src="../img/icon-home.svg" alt="icone casa">Inicio</a></li>
                <li><a href="medico.html"><img src="../img/icons-estetoscópio-48.png" alt="icone medico">Medicos</a></li>
                <li><a href="pacientes.html"><img src="../img/icons-pessoas-48.svg" alt="icone pacientes">Pacientes</a></li>
                <li><a href="consulta.html"><img src="../img/icon-calendar-42.svg" alt="icone consulta">Consultas</a></li>
            </ul>
        </nav>
    </header>

    <main>
         <header class="header-segundario">
            <h2>Cadastro Consultas</h2>
            <p>Gerencie os agendamentos de consultas</p>
        </header>


        <section class="gerenciamento">

                <form action="">
                <h3><img  class="img-novo-medico" src="../img/icon-calendar-42.svg" alt="">Novo Consulta</h3>
                <p>Agende uma nova consulta</p>

                <label for="">Medico*</label>
                      
                <label for="">Paciente*</label>

                <label for="data-consulta">Data*</label>
                <input type="date" name="" id="">

                <label for="">Horário*</label>
                <input type="time">

                <label for="">Observaçoes</label>
                <input type="text">
           

                <div class="btns">
                    <button type="button" class="btn-salvar" onclick="agendarConsulta()">Cadastrar Médico</button>
                    <button type="button" class="btn-cancelar" onclick="cancelarConsulta()"
                    ><span class="material-symbols-outlined">close</span>
                    Cancelar</button>
                </div>
    
            </form>

        </section>

    </main>



    <script src="../dist/script.js"></script>
</body>
</html>
